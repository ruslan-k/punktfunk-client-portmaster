name: Build and release PortMaster package

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional release tag to create, for example v0.1.0-alpha.1"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: punktfunk-portmaster-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout port repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build cross-compilation container
        run: |
          docker build \
            --build-arg RUST_TOOLCHAIN=1.96.0 \
            -f build/Dockerfile \
            -t punktfunk-portmaster-builder .

      - name: Build Punktfunk and PortMaster package
        run: |
          docker run --rm \
            -e GITHUB_SHA="$GITHUB_SHA" \
            -v "$GITHUB_WORKSPACE:/work" \
            punktfunk-portmaster-builder \
            ./scripts/build.sh

      - name: Show package metadata
        run: |
          cat dist/build-info.json
          cat dist/SHA256SUMS
          unzip -l dist/punktfunk.zip | sed -n '1,120p'

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: punktfunk-portmaster-${{ github.sha }}
          path: |
            dist/punktfunk.zip
            dist/SHA256SUMS
            dist/build-info.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish rolling edge prerelease
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete edge --yes --cleanup-tag || true
          git tag -f edge "$GITHUB_SHA"
          git push --force origin refs/tags/edge
          gh release create edge \
            dist/punktfunk.zip \
            dist/SHA256SUMS \
            dist/build-info.json \
            --prerelease \
            --title "Punktfunk PortMaster edge" \
            --notes "Automated TrimUI Smart Pro S test build from $GITHUB_SHA. Experimental SDL3/Vulkan port."

      - name: Publish tagged release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/punktfunk.zip \
            dist/SHA256SUMS \
            dist/build-info.json \
            --verify-tag \
            --generate-notes \
            --title "$GITHUB_REF_NAME"

      - name: Publish manual release
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gh release create "$RELEASE_TAG" \
            dist/punktfunk.zip \
            dist/SHA256SUMS \
            dist/build-info.json \
            --target "$GITHUB_SHA" \
            --generate-notes \
            --title "$RELEASE_TAG"
